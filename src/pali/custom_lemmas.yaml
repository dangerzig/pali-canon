      - {lemma: samaṇa, pos: masc}
      - {lemma: atthi, pos: verb}
  yamamavhayāmā:
    parts: [yaṃ, amaṃ, avhayāma]
    components:
      - {lemma: ya, pos: pron}
      - {lemma: ahaṃ, pos: pron}
      - {lemma: avhayati, pos: verb}
  tenupaṅkamissāmā:
    parts: [tena, upaṅkamissāma]
