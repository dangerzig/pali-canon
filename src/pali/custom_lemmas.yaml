      - {lemma: dubbala, pos: adj}
      - {lemma: ahaṃ, pos: pron}
  appesakkhohama:
    parts: [appesakkho, ahaṃ]
    components:
      - {lemma: appesakkha, pos: adj}
      - {lemma: ahaṃ, pos: pron}
  anupādānohama:
    parts: [anupādāno, ahaṃ]
    components:
      - {lemma: anupādāna, pos: adj}
      - {lemma: ahaṃ, pos: pron}
  nibbānādhimuttohama:
    parts: [nibbānādhimutto, ahaṃ]
    components:
      - {lemma: nibbānādhimutta, pos: adj}
      - {lemma: ahaṃ, pos: pron}
  aññathādhammohama:
    parts: [aññathādhammo, ahaṃ]
    components:
      - {lemma: aññathādhamma, pos: adj}
      - {lemma: ahaṃ, pos: pron}
  sakyaputtiyāmhā:
    parts: [sakyaputtiyā, amhā]
    components:
      - {lemma: sakyaputtiya, pos: adj}
      - {lemma: atthi, pos: verb}
  samaṇāmhā:
    parts: [samaṇā, amhā]
