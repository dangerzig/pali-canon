# =============================================================================
# METRICAL VARIANTS
# =============================================================================
# Forms that differ only in vowel length due to metrical requirements.
# These map to existing DPD lemmas but with vowel changes.
# Not candidates for DPD addition - just scribal/metrical variants.

metrical_variants:
  # Short for long vowels
  khīḷitā:
    lemma: kīḷita
    pos: pp
    note: "khil -> kil (aspirated to unaspirated) + a -> a"
  bhumyā:
    lemma: bhūmi
    pos: fem
    note: "u -> u"
  atāpī:
    lemma: ātāpī
    pos: adj
    note: "a -> a (initial)"
  varī:
    lemma: vārī
    pos: nt
    note: "a -> a"
  viṇā:
    lemma: vīṇā
    pos: fem
    note: "i -> i"
  makāsi:
    lemma: mākāsi
    pos: aor
    note: "a -> a"
  piḷayi:
    lemma: pīḷeti
    pos: aor
    note: "i -> i"

  # Geminated consonants (metrical lengthening)
  uppādiyati:
    lemma: upādiyati
    pos: verb
    note: pp for p
  uppari:
    lemma: upari
    pos: ind
    note: pp for p
  upparito:
    lemma: uparito
    pos: ind
    note: pp for p

  # Long for short
  uhacca:
    lemma: ūhacca
    pos: abs
    note: "u -> u"

  # Niggahita variants
  haṃci:
    lemma: hañci
    pos: ind
    note: "m -> ñ before c"

  # Verb forms with lengthened final vowel (metrical)
  pavāressatī:
    lemma: pavāreti
    pos: verb
    note: "i -> ī (metrical)"
  paricāressantī:
    lemma: paricāreti
    pos: verb
    note: "i -> ī (metrical)"
  bodhayī:
    lemma: bodheti
    pos: aor
    note: "i -> ī (metrical)"
  damayī:
    lemma: dameti
    pos: aor
    note: "i -> ī (metrical)"
  niyyādayī:
    lemma: niyyādeti
    pos: aor
    note: "i -> ī (metrical)"
  āyūhanī:
    lemma: āyūhati
    pos: adj
    note: striving (with lengthened final)

  # Absolutives with metrical lengthening
  tārayitvā:
    lemma: tāreti
    pos: abs
    note: having saved
  thomayitvā:
    lemma: thometi
    pos: abs
    note: having praised
  bodhayitvā:
    lemma: bodheti
    pos: abs
    note: having awakened
  abhināditvā:
    lemma: abhinadati
    pos: abs
    note: having resounded
  temayitvā:
    lemma: temeti
    pos: abs
    note: having moistened
  samussetvā:
    lemma: samusseti
    pos: abs
    note: having raised up
  santāpayitvā:
    lemma: santāpeti
    pos: abs
    note: having heated
  paṭipassambhayitvā:
    lemma: paṭipassambheti
    pos: abs
    note: having calmed
  sāvayitvā:
    lemma: sāveti
    pos: abs
    note: having announced
  nisedhayitvā:
    lemma: nisedheti
    pos: abs
    note: having prevented
  āvejjetvā:
    lemma: āvajjeti
    pos: abs
    note: having turned toward
  vicintayitvā:
    lemma: vicinteti
    pos: abs
    note: having considered
  vosajjetvā:
    lemma: vosajjati
    pos: abs
    note: having released
  upalakkhayitvā:
    lemma: upalakkheti
    pos: abs
    note: having observed
  uppāṭayitvā:
    lemma: uppāṭeti
    pos: abs
    note: having torn out
  parirakkhitvā:
    lemma: parirakkhati
    pos: abs
    note: having protected

  # Nouns/adjectives with metrical vowel changes
  phaggunī:
    lemma: phagguna
    pos: masc
    note: month name (with lengthened final)
  rocinī:
    lemma: rocana
    pos: adj
    note: pleasing (fem with lengthened final)
  udañcanī:
    lemma: udañcana
    pos: nt
    note: drawing water (with lengthened final)
  # Compound + metrical (verb fusions in verse)
  gihisāmicī:
