# =============================================================================
# SANDHI DECOMPOSITIONS
# =============================================================================
# Complex sandhi that DPD doesn't decompose.

sandhi_decompositions:
  # X + iti (quotative marker)
  akkusaloti:
    parts: [akusalo, iti]
    components:
      - {lemma: akusala, pos: adj}
      - {lemma: iti, pos: ind}
  vosajjatīti:
    parts: [vosajjati, iti]
    components:
      - {lemma: vosajjati, pos: verb}
      - {lemma: iti, pos: ind}
  pettivisayikoti:
    parts: [pettivisayiko, iti]
    components:
      - {lemma: pettivisayika, pos: adj}
      - {lemma: iti, pos: ind}
  otaraṇoti:
    parts: [otaraṇo, iti]
    components:
      - {lemma: otaraṇa, pos: nt}
      - {lemma: iti, pos: ind}

  # X + assa/asmi (genitive/verb)
  tipissa:
    parts: [tipi, assa]
    components:
      - {lemma: api, pos: ind}
      - {lemma: assa, pos: pron}
  sukhamasmī:
    parts: [sukhaṃ, asmi]
    components:
      - {lemma: sukha, pos: nt}
      - {lemma: atthi, pos: verb}
  tumhaṃmhi:
    parts: [tumhaṃ, amhi]
    components:
      - {lemma: tumha, pos: pron}
      - {lemma: atthi, pos: verb}
  vaggulissa:
    parts: [vagguli, assa]
    components:
      - {lemma: vagguli, pos: masc}
      - {lemma: assa, pos: pron}
  jāgussa:
    parts: [jāgu, assa]
    components:
      - {lemma: jāgu, pos: masc}
      - {lemma: assa, pos: pron}

  # Elision sandhi
  m:
    parts: [me]
    components:
      - {lemma: ahaṃ, pos: pron}
    note: elision of 'me' before vowel (m'idhekacce = me idhekacce)

  # Negation sandhi
  nosi:
    parts: [no, asi]
    components:
      - {lemma: na, pos: ind}
      - {lemma: atthi, pos: verb}

  # Particle combinations
  iccā:
    parts: [iti, ca]
    components:
      - {lemma: iti, pos: ind}
      - {lemma: ca, pos: ind}
  yañcāha:
    parts: [yaṃ, ca, āha]
    components:
      - {lemma: ya, pos: pron}
      - {lemma: ca, pos: ind}
      - {lemma: āha, pos: verb}
  cīdha:
    parts: [ca, idha]
    components:
      - {lemma: ca, pos: ind}
      - {lemma: idha, pos: ind}

  # Pronoun combinations
  tetaṃ:
    parts: [te, etaṃ]
    components:
      - {lemma: ta, pos: pron}
      - {lemma: eta, pos: pron}
  menaṃ:
    parts: [me, enaṃ]
    components:
      - {lemma: ahaṃ, pos: pron}
      - {lemma: eta, pos: pron}
  mameta:
    parts: [mama, eta]
    components:
      - {lemma: ahaṃ, pos: pron}
      - {lemma: eta, pos: pron}
  tvevahaṃ:
    parts: [tu, eva, ahaṃ]
    components:
      - {lemma: tu, pos: ind}
      - {lemma: eva, pos: ind}
      - {lemma: ahaṃ, pos: pron}

  # Pronoun + verb sandhi
  mabhibhāsasi:
    parts: [maṃ, abhibhāsasi]
    components:
      - {lemma: ahaṃ, pos: pron}
      - {lemma: abhibhāsati, pos: verb}

  # Prefix compounds (pari-, pa-, abhi-)
  paridhaṃsati:
    parts: [pari, dhaṃsati]
    components:
      - {lemma: pari, pos: prefix}
      - {lemma: dhaṃsati, pos: verb}
  paridameti:
    parts: [pari, dameti]
    components:
      - {lemma: pari, pos: prefix}
      - {lemma: dameti, pos: verb}
  paridametvā:
    parts: [pari, dametvā]
    components:
      - {lemma: pari, pos: prefix}
      - {lemma: dameti, pos: abs}
  pariyāyitvā:
    parts: [pari, āyitvā]
    components:
      - {lemma: pari, pos: prefix}
      - {lemma: āyāti, pos: abs}
  parikeḷanā:
    parts: [pari, keḷanā]
    components:
      - {lemma: pari, pos: prefix}
      - {lemma: keḷanā, pos: fem}
  pahitvāna:
    parts: [pa, hitvāna]
    components:
      - {lemma: pa, pos: prefix}
      - {lemma: jahati, pos: abs}
  pavārayi:
    parts: [pa, vārayi]
    components:
      - {lemma: pa, pos: prefix}
      - {lemma: vāreti, pos: aor}

  # Complex compounds
  svajjekova:
    parts: [sva, ajja, eko, iva]
    components:
      - {lemma: sa, pos: pron}
      - {lemma: ajja, pos: ind}
      - {lemma: eka, pos: card}
      - {lemma: iva, pos: ind}

  # Pronoun-verb fusions (X + ahaṃ + verb)
  dubbalohamasmi:
    parts: [dubbalo, ahaṃ, asmi]
    components:
      - {lemma: dubbala, pos: adj}
      - {lemma: ahaṃ, pos: pron}
      - {lemma: atthi, pos: verb}
