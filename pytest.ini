[pytest]
testpaths = tests
markers =
    slow: tests that build the search index or are otherwise slow (deselect with '-m "not slow"')
    corpus: tests that depend on the full checked-in corpus / DPD data (deselect with '-m "not corpus"')

# Test tiers:
#   Fast unit tests (no corpus/DPD, sub-second):
#       pytest -m "not slow and not corpus"
#   Full acceptance run (default; needs corpus + DPD, several minutes):
#       pytest
